<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="1200" height="1700">
  <defs>
    <!-- Cyber Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer Tech Border Frame -->
  <rect x="24" y="24" width="1152" height="1652" rx="16" fill="none" stroke="url(#cyberCyan)" stroke-width="4" stroke-opacity="0.85"/>
  <rect x="34" y="34" width="1132" height="1632" rx="12" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="16 10" stroke-opacity="0.5"/>

  <!-- Top Tech Banner -->
  <rect x="250" y="24" width="700" height="54" rx="10" fill="#090d16" stroke="url(#cyberCyan)" stroke-width="2.5"/>
  <text x="600" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DIESNATALIS <tspan fill="#00e5ff">HIMATIKOM</tspan> 2026
  </text>

  <!-- Top Decorative Tech Accents -->
  <text x="70" y="58" font-family="monospace" font-size="14" font-weight="bold" fill="#00e5ff" opacity="0.85">&lt;DEV::2026&gt;</text>
  <text x="1130" y="58" font-family="monospace" font-size="14" font-weight="bold" fill="#ec4899" text-anchor="end" opacity="0.85">01001001//HMTK</text>

  <!-- Futuristic Corner Brackets -->
  <!-- Top-Left -->
  <path d="M 24 90 L 24 24 L 90 24" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="square"/>
  <circle cx="96" cy="24" r="4" fill="#00e5ff"/>
  <!-- Top-Right -->
  <path d="M 1176 90 L 1176 24 L 1110 24" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="square"/>
  <circle cx="1104" cy="24" r="4" fill="#ec4899"/>
  <!-- Bottom-Left -->
  <path d="M 24 1610 L 24 1676 L 90 1676" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="square"/>
  <circle cx="96" cy="1676" r="4" fill="#ec4899"/>
  <!-- Bottom-Right -->
  <path d="M 1176 1610 L 1176 1676 L 1110 1676" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="square"/>
  <circle cx="1104" cy="1676" r="4" fill="#00e5ff"/>

  <!-- Left & Right HUD Ticks -->
  <g fill="#00e5ff" opacity="0.4">
    <rect x="12" y="400" width="8" height="40" rx="2"/>
    <rect x="12" y="800" width="8" height="40" rx="2"/>
    <rect x="12" y="1200" width="8" height="40" rx="2"/>
    <rect x="1180" y="400" width="8" height="40" rx="2"/>
    <rect x="1180" y="800" width="8" height="40" rx="2"/>
    <rect x="1180" y="1200" width="8" height="40" rx="2"/>
  </g>

  <!-- Bottom Event Banner Bar -->
  <rect x="180" y="1624" width="840" height="52" rx="10" fill="#090d16" stroke="url(#cyberCyan)" stroke-width="2"/>
  <text x="600" y="1656" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">
    &lt; <tspan fill="#00e5ff">CODE</tspan> • <tspan fill="#a855f7">CONNECT</tspan> • <tspan fill="#ec4899">CELEBRATE</tspan> /&gt;
  </text>
  <text x="600" y="1670" font-family="monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    INFORMATICS &amp; COMPUTER SCIENCE STUDENT ASSOCIATION
  </text>
</svg>
