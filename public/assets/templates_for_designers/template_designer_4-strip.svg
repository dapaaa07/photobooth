<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 6200" width="2400" height="6200">
  <defs>
    <style>
      .guide-text { font-family: 'Helvetica Neue', Arial, sans-serif; }
