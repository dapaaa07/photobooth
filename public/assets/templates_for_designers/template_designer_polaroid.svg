<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3400" width="2400" height="3400">
  <defs>
    <style>
      .guide-text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- LAYER 1: CANVAS BOUNDARY -->
  <rect id="canvas-boundary" width="2400" height="3400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>

  <!-- LAYER 2: HEADER BANNER (PANDUAN UKURAN) -->
  <rect x="80" y="24" width="2240" height="76" rx="16" fill="#0f172a" />
  <text x="1200" y="72" class="guide-text" font-size="36" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    TEMPLATE DESAIN FREMIO: POLAROID CLASSIC PORTRAIT (1 FOTO) • UKURAN KANVAS: 2400 × 3400 PX
  </text>

  <!-- LAYER 3: PHOTO SLOTS (AREA FOTO YANG JANGAN DITUTUP GAMBAR SOLID) -->
  
      <!-- SLOT #1 -->
      <g id="slot-1">
        <!-- Transparent cutout area indicator -->
        <rect x="160" y="160" width="2080" height="2600" rx="20" fill="#38bdf8" fill-opacity="0.12" stroke="#0284c7" stroke-width="6" stroke-dasharray="20 12"/>
        
        <!-- Slot Center Label -->
        <circle cx="1200" cy="1420" r="50" fill="#0284c7" />
        <text x="1200" y="1436" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
        <text x="1200" y="1510" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#0369a1" text-anchor="middle">LUBANG FOTO #1 (TRANSPARAN)</text>
        <text x="1200" y="1565" font-family="monospace" font-size="32" font-weight="600" fill="#64748b" text-anchor="middle">2080 × 2600 px</text>
      </g>
    

  <!-- LAYER 4: SAFE DESIGN AREA HINT -->
  <rect x="60" y="3320" width="2280" height="60" rx="12" fill="#e2e8f0"/>
  <text x="1200" y="3360" class="guide-text" font-size="28" font-weight="600" fill="#475569" text-anchor="middle">
    💡 TIPS: Letakkan ornamen frame, stiker, teks branding, &amp; hiasan di luar atau di sekeliling kotak lubang foto.
  </text>
</svg>